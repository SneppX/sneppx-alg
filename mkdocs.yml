site_name: SneppX-ALG
site_description: Experimental native C/C++ machine-learning framework with Python bindings for tensor operations, autograd, and neural-network components. Alpha software; distributed and security subsystems have documented limitations.
  Documentation for the SneppX-ALG C/C++ project and its Python bindings.
  Includes installation, API references, architecture notes, security
  limitations, and development guides.
site_author: Ammar [SNEPPX]
site_url: https://sneppx.github.io/sneppx-alg/

repo_url: https://github.com/SneppX/sneppx-alg
repo_name: SneppX/sneppx-alg
edit_uri: edit/main/docs/

copyright: >
  SneppX-ALG contributors. See the repository license for terms.

theme:
  name: material
  custom_dir: overrides
  favicon: logo.jpeg
  icon:
    repo: fontawesome/brands/github
    menu: material/menu
    close: material/close
  logo: logo.jpeg
  palette:
    - scheme: slate
      primary: indigo
      accent: amber
  features:
    - navigation.expand
    - navigation.sections
    - navigation.tracking
    - navigation.keyboard
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.path
    - navigation.top
    - search.share
    - back-to-top
  readme_file: false
  exclude_docs: README.md
extra_css:
  - stylesheets/extra.css
  - stylesheets/run-snippet.css
  - stylesheets/command-palette.css
  - stylesheets/shortcuts.css
  - stylesheets/visualizers.css
  - stylesheets/progress.css
extra_javascript:
  - javascripts/extra.js
  - javascripts/playground.js
  - javascripts/run-snippet.js
  - javascripts/command-palette.js
  - javascripts/shortcuts.js
  - javascripts/autograd-core.js
  - javascripts/autograd-graph.js
  - javascripts/matmul-viz.js
  - javascripts/conv-viz.js
  - javascripts/optimizer-race.js
  - javascripts/loss-gallery.js
  - javascripts/progress.js
  - javascripts/git-browser-highlighter.js
  - javascripts/git-browser.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SneppX/sneppx-alg
      name: SNEPPX-Alg on GitHub
    - icon: fontawesome/solid/rss
      link: https://sneppx.github.io/sneppx-alg/latest/feed_rss_updated.xml
      name: RSS feed
plugins:
  - search
  - social:
      cards: true
      cache_dir: .cache
      cards_layout_options:
        font_family: Roboto
  - rss:
      match_path: "(changelog|release_notes)/.*"
      use_git: true
      use_material_blog: false
      use_material_social_cards: false
      feed_description: SNEPPX-Alg release notes and changelog
  - mike:
      version_selector: true

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          element: div
  - pymdownx.arithmatex:
      generic: true
      preview: true
  - pymdownx.betterem:
      smart_enable: []
  - pymdownx.magiclink:
      repo_url_shorthand: True
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - toc:
      permalink: true
      separator: "-"

