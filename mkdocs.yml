site_name: SNEPPX-Algo
site_description: >
    Secure neural algorithm pipeline: HSS -> SER -> ARC -> NPE -> FM wrapped in
    10 security layers (S0-S9). Post-quantum crypto, distributed training
    (ZeRO/TP/PP/EP), quantization (INT8/INT4/FP8/AWQ/GPTQ), and a NumPy-fallback
    Python API.
site_author: Ammar [SNEPPX]
site_url: https://SneppX.github.io/sneppx-alg/

repo_url: https://github.com/SneppX/sneppx-alg
repo_name: SneppX/sneppx-alg
edit_uri: edit/main/docs/

copyright: >
    Built with the SNEPPX-Algo documentation stack. Content licensed under the
    repository's MIT license.

theme:
    name: material
    custom_dir: overrides
    favicon: logo.jpeg
    icon:
        repo: fontawesome/brands/github
        menu: material/menu
        close: material/close
    logo: logo.jpeg
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: deep purple
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: amber
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
    features:
        - navigation.expand
        - navigation.sections
        - navigation.tracking
        - navigation.keyboard
        - search.suggest
        - search.highlight
        - content.code.annotate
        - content.code.copy
        - content.tooltips
        - navigation.path
        - navigation.top
        - search.share
        - back-to-top
    readme_file: false
    exclude_docs: README.md
extra_css:
    - stylesheets/extra.css
extra_javascript:
    - javascripts/extra.js
    - javascripts/playground.js
extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/SneppX/sneppx-alg
          name: SNEPPX-Alg on GitHub
        - icon: fontawesome/solid/rss
          link: https://sneppx.github.io/sneppx-alg/latest/feed_rss_updated.xml
          name: RSS feed
plugins:
    - search
    - rss:
          match_path: "(changelog|release_notes)/.*"
          use_git: true
          use_material_blog: false
          use_material_social_cards: false
          feed_description: SNEPPX-Alg release notes and changelog
    - mike:
          version_selector: true

markdown_extensions:
    - admonition
    - abbr
    - attr_list
    - md_in_html
    - footnotes
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                element: div
    - pymdownx.arithmatex:
          generic: true
          preview: true
    - pymdownx.betterem:
          smart_enable: []
    - pymdownx.magiclink:
          repo_url_shorthand: True
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.tilde
    - pymdownx.snippets:
          base_path: docs
    - toc:
          permalink: true
          separator: "&#702;"

