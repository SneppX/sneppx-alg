# Example serving configuration for the SneppX serving engine.
#
# This single file drives both the C control plane (net/http/serving_engine.c)
# and the Python engine (SneppX_ALG.interface_bindings.serving_engine).
# The `serving.*` params use flat dotted keys so the C hot-reload parser
# understands them directly; the nested `models:` and `traffic:` blocks are
# consumed by the Python `serve_from_config` loader.
#
# Usage:
#   sneppx-serve start --config config/serving.yaml
#   python -c "from SneppX_ALG.interface_bindings.serving_engine import serve_from_config; serve_from_config('config/serving.yaml')"

serving.listen: 127.0.0.1
serving.port: 8300
serving.max_batch_size: 32           # Maximum sequence batch size for continuous batching
serving.batch_timeout_ms: 5.0        # Max queue wait time before dispatching batch
serving.n_workers: 4                 # Worker threads for concurrent request handling
serving.warmup_iters: 8              # Warmup iterations before serving live traffic
serving.quantization: int8           # 'none', 'int8', 'int4', 'fp8'

models:
  gpt2:
    version_id: v1
    description: "reference GPT-2 style model"
    weight: 100
  bert:
    version_id: v1
    description: "reference BERT style model"
    weight: 0

traffic.bert: "v1:100"
