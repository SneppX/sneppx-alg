# Reference Conda recipe template for sneppx-alg.
# Not a published feedstock: validate the version, source hash, and build
# variants in the dedicated feedstock repository before using it.

{% set version = "1.0.0" %}

package:
  name: sneppx-alg
  version: {{ version }}

source:
  url: https://github.com/SneppX/sneppx-alg/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [not (linux or win)]
  skip: true  # [osx]
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  script_env:
    - SNEPPX_BUILD_CUDA=ON
    - SNEPPX_USE_ASAN=OFF
    - SNEPPX_USE_UBSAN=OFF
  skip_existing: true
  cmake_args:
    - -DSNEPPX_BUILD_CUDA=ON

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.16
    - ninja
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - numpy
    - cmake
    - ninja
  run:
    - python >=3.9
    - numpy >=1.21
    - {{ pin_compatible('numpy') }}
    - huggingface_hub >=0.16.0  # optional

test:
  imports:
    - sneppx_alg
    - sneppx_alg.interface_bindings
    - sneppx_alg.interface_bindings.tensor
    - sneppx_alg.interface_bindings.nn
    - sneppx_alg.interface_bindings.optim
  commands:
    - python -c "import sneppx_alg; print(sneppx_alg.__version__)"
    - python -c "from sneppx_alg.interface_bindings import Tensor; print('Tensor OK')"
    - python -c "from sneppx_alg.interface_bindings.nn import Linear; print('NN OK')"
    - python -c "from sneppx_alg.interface_bindings.optim import AdamW; print('Optim OK')"

about:
  home: https://github.com/SneppX/sneppx-alg
  license: MIT
  license_file: LICENSE
  summary: "Experimental native C/C++ machine-learning framework with Python tensor and autograd APIs"
  description: |
    SneppX-ALG is Alpha-stage software with a native C/C++ codebase and Python
    APIs for tensor operations, automatic differentiation, and neural-network
    components. API coverage and validation vary by subsystem and backend.
    Multi-rank distributed training, FSDP, and ZeRO are not validated as
    end-to-end features. Security components are experimental and are not
    independently certified; no FIPS validation or certification is claimed.
  doc_url: https://github.com/SneppX/sneppx-alg
  dev_url: https://github.com/SneppX/sneppx-alg

extra:
  recipe-maintainers:
    - ammar49-cyber
