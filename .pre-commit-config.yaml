repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^conda-forge-recipe/meta[.]yaml$'
      - id: check-toml
      - id: check-json
        exclude: '^(benchmarks/baseline[.]json|tests/data/acvp/slhdsa_keygen_kat[.]json)$'
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: '^tests/python/test_secrets_redact[.]py$'
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.16.0
    hooks:
      - id: gersemi
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/'

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [-style=file, -i]
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff-format
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/'

  # Prettier formats web sources, JSON, YAML, and Markdown.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: b40b4e02d5a0c977e64da51e8742e3240ef6372a
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, html, css]
        args: [--tab-width, "2", --print-width, "120"]
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist|node_modules|docs/api/doxygen|conda-forge-recipe)/|^(benchmarks/baseline[.]json|tests/data/acvp/slhdsa_keygen_kat[.]json|[.]clang-tidy)$'

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/'

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ci, -bn]
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist|conda-forge-recipe)/'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Format Rust files directly; the repository has nested Cargo workspaces.
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt all Rust source files
        entry: rustfmt --edition 2021
        language: system
        types: [rust]
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

  # Separate documentation coverage validation; not a source formatter.
  - repo: local
    hooks:
      - id: sneppx-docs
        name: sneppx-format --docs (Layer 1/4 doc coverage)
        entry: sneppx-format --docs --no-color
        language: system
        files: '\.(c|h|cc|cpp|cxx|hpp|cu|cuh)$'
        fail_fast: false
