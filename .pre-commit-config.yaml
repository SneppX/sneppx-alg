repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # GitHub Apps cannot update workflow files without the restricted
        # `workflows` permission, so the formatter bot must not rewrite them.
        exclude: '^\.github/workflows/'
      - id: end-of-file-fixer
        exclude: '^\.github/workflows/'
      - id: check-yaml
        # conda-forge/meta.yaml is a Jinja recipe, not parseable YAML.
        exclude: '^conda-forge-recipe/meta\.yaml$'
      - id: check-toml
      - id: check-json
        # benchmarks/baseline.json is JSON Lines, one benchmark per line.
        exclude: '^benchmarks/baseline\.json$'
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^\.github/workflows/'

  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.16.0
    hooks:
      - id: gersemi
        exclude: "(^|/)(third_party|vendor|external|generated|build|dist)/"

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [-style=file, -i]
        exclude: "(^|/)(third_party|vendor|external|generated|build|dist)/"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      # Formatting is enforced here; legacy lint diagnostics are tracked in
      # AUDIT-2026-11-22.md and must not block the formatter promotion bot.
      - id: ruff-format
        exclude: "(^|/)(third_party|vendor|external|generated|build|dist)/"

  # Prettier owns consistent formatting for web sources, JSON, and YAML.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: b40b4e02d5a0c977e64da51e8742e3240ef6372a
    hooks:
      - id: prettier
        # Markdown is owned by markdownlint below; running both rewrites the
        # same files in opposite directions and makes the promotion bot loop.
        types_or: [javascript, jsx, ts, tsx, json, yaml, html, css]
        args: [--tab-width, "2", --print-width, "120"]
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist|node_modules|docs/api/doxygen)/|^benchmarks/baseline\.json$|^\.clang-tidy$|^tests/data/acvp/slhdsa_keygen_kat\.json$|^conda-forge-recipe/meta\.yaml$|^\.github/workflows/'

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        exclude: "(^|/)(third_party|vendor|external|generated|build|dist)/"

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ci, -bn]
        # The legacy helper contains nested sh -c quoting that shfmt cannot parse.
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/|^scripts/pre-commit\.sh$'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml, --fix]
        exclude: "(^|/)(third_party|vendor|external|generated|build|dist)/"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        # conda-forge/meta.yaml is a Jinja template, not parseable YAML.
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/|^conda-forge-recipe/meta\.yaml$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
        # Nested sh -c quoting in this legacy helper is not parseable by
        # shellcheck; its checks are covered by the scripts/precommit-gate.ps1.
        exclude: '(^|/)(third_party|vendor|external|generated|build|dist)/|^scripts/pre-commit\.sh$'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Shell files are checked by the dedicated shellcheck hook above.
        args: [-shellcheck=]

  # Canonical language formatters for the Rust and Go source trees.
  - repo: local
    hooks:
      - id: rustfmt-workspace
        name: rustfmt workspace
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: rustfmt-security
        name: rustfmt security crate
        entry: rustfmt --edition 2021
        language: system
        files: '^security/rust/.*\.rs$'
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

  # Local hook: SNEPPX documentation coverage (docs/COMMENTING.md Layers 1 & 4).
  - repo: local
    hooks:
      - id: sneppx-docs
        name: sneppx-format --docs (Layer 1/4 doc coverage)
        entry: sneppx-format --docs --no-color
        language: system
        files: '\.(c|h|cc|cpp|cxx|hpp|cu|cuh)$'
        fail_fast: false
