[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sneppx-alg"
version = "1.1.1"
description = "Next-generation AI architecture with security built into the foundation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ammar [SNEPPX]", email = "algoSNEPPX@gmail.com"},
]
keywords = [
    "ai", "machine-learning", "deep-learning", "neural-networks",
    "security", "post-quantum", "cryptography",
    "distributed-training", "cuda", "tensor",
    "state-space", "mixture-of-experts", "adversarial",
    "model-zoo", "quantization", "zero",
    "llama", "mistral", "qwen", "deepseek",
    "attention", "mamba", "transformer",
    "formal-verification", "differential-privacy",
    "npu", "nccl"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://github.com/ammar49-cyber/sneppx-alg"
Repository = "https://github.com/ammar49-cyber/sneppx-alg"
Documentation = "https://github.com/ammar49-cyber/sneppx-alg#readme"
"Bug Tracker" = "https://github.com/ammar49-cyber/sneppx-alg/issues"
"Release Notes" = "https://github.com/ammar49-cyber/sneppx-alg/releases"

[project.scripts]
sneppx-train = "SneppX_ALG.interface_bindings.train_cli:main"
sneppx-serve = "SneppX_ALG.interface_bindings.serve_cli:main"
sneppx-experiment = "SneppX_ALG.interface_bindings.experiment_cli:main"
sneppx-eval = "SneppX_ALG.interface_bindings.eval_cli:main"
sneppx-quantize = "SneppX_ALG.interface_bindings.quantize_cli:main"
sneppx-rlhf = "SneppX_ALG.interface_bindings.rlhf_cli:main"
sneppx-onnx = "SneppX_ALG.interface_bindings.onnx_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "scipy>=1.7"]
hf = ["huggingface_hub>=0.16.0"]
serve = ["uvicorn>=0.22.0"]
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==0.25.1",
    "mkdocs-autorefs==0.5.0",
    "mkdocs-gen-files",
    "mkdocs-section-index",
    "mkdocs-literate-nav",
    "mike>=2.0",
]

[tool.setuptools.packages.find]
where = ["bindings/python"]

[tool.setuptools.package-data]
SneppX_ALG = [
    "_SNEPPX_c*.pyd", "_SNEPPX_c*.so",
    "_sneppx_c*.pyd", "_sneppx_c*.so",
    "_arix_c*.pyd", "_arix_c*.so",
    "interface_bindings/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
