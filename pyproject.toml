[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sneppx-alg"
version = "1.5.3"
description = "Open-source AI and machine-learning framework with a native C/C++ core and Python bindings for tensor operations, autograd, and neural-network components"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Ammar [SNEPPX]", email = "algoSNEPPX@gmail.com" }]
keywords = [
  "ai",
  "machine-learning",
  "deep-learning",
  "tensor",
  "autograd",
  "neural-network",
  "c",
  "cpp",
  "python",
  "numpy",
  "scientific-computing",
  "quantization",
  "cryptography",
  "ai-security",
  "distributed-training",
  "transformer",
  "mixture-of-experts",
  "state-space",
  "cuda",
  "open-source",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security :: Cryptography",
]

dependencies = ["numpy>=1.21.0", "pyyaml>=5.1", "cryptography>=40.0.0"]

[project.urls]
Homepage = "https://sneppx.github.io/sneppxov/"
Repository = "https://github.com/SneppX/sneppx-alg"
Documentation = "https://sneppx.github.io/sneppx-alg/"
"Bug Tracker" = "https://github.com/SneppX/sneppx-alg/issues"
"Release Notes" = "https://github.com/SneppX/sneppx-alg/releases"

[project.scripts]
sneppx-train = "SneppX_ALG.interface_bindings.train_cli:main"
sneppx-serve = "SneppX_ALG.interface_bindings.serve_cli:main"
sneppx-experiment = "SneppX_ALG.interface_bindings.experiment_cli:main"
sneppx-eval = "SneppX_ALG.interface_bindings.eval_cli:main"
sneppx-quantize = "SneppX_ALG.interface_bindings.quantize_cli:main"
sneppx-rlhf = "SneppX_ALG.interface_bindings.rlhf_cli:main"
sneppx-onnx = "SneppX_ALG.interface_bindings.onnx_cli:main"
sneppx-ctm = "ctm_tools.py.ctm:main"
sneppx-ctm-functions = "ctm_tools.py.ctm_count_functions:main"
sneppx-ctm-headers = "ctm_tools.py.ctm_count_headers:main"
sneppx-ctm-diff = "ctm_tools.py.ctm_diff_loc:main"
sneppx-ctm-large = "ctm_tools.py.ctm_list_large_files:main"
sneppx-ctm-recent = "ctm_tools.py.ctm_recent_files:main"
sneppx-ctm-todo = "ctm_tools.py.ctm_todo_scan:main"
sneppx-ctm-links = "ctm_tools.py.ctm_doc_links:main"
sneppx-ctm-duplicates = "ctm_tools.py.ctm_duplicate_files:main"
sneppx-ctm-churn = "ctm_tools.py.ctm_churn:main"
sneppx-ctm-license = "ctm_tools.py.ctm_license_inventory:main"
sneppx-ctm-schema = "ctm_tools.py.ctm_schema_check:main"
sneppx-ctm-encoding = "ctm_tools.py.ctm_encoding_report:main"
sneppx-ctm-ignore = "ctm_tools.py.ctm_ignore_audit:main"
sneppx-ctm-trend = "ctm_tools.py.ctm_trend:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "scipy>=1.7"]
hf = ["huggingface_hub>=0.16.0"]
serve = ["uvicorn>=0.22.0"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material[imaging]==9.7.7",
  "mkdocstrings[python]==0.25.1",
  "mkdocs-autorefs==0.5.0",
  "mkdocs-gen-files",
  "mkdocs-section-index",
  "mkdocs-literate-nav",
  "mike>=2.0",
  "mkdocs-rss-plugin>=1.3",
  "properdocs-theme-mkdocs>=1.6.7",
]

[tool.setuptools]
package-dir = { "" = "bindings/python", "ctm_tools" = "ctm_tools" }

[tool.setuptools.packages.find]
where = ["bindings/python", "."]
include = ["SneppX_ALG*", "ctm_tools*"]

[tool.setuptools.package-data]
SneppX_ALG = [
  "_SNEPPX_c*.pyd",
  "_SNEPPX_c*.so",
  "_sneppx_c*.pyd",
  "_sneppx_c*.so",
  "_arix_c*.pyd",
  "_arix_c*.so",
  "interface_bindings/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
