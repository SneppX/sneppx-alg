name: Publish documentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.autodoc.yml"
      - "overrides/**"
      - "scripts/validate_mkdocs_nav.py"
      - "scripts/build_git_browser_index.py"
      - "Doxyfile"
      - "pyproject.toml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all repository branches and tags
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' --tags

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate C/C++ API reference
        run: |
          doxygen Doxyfile
          test -s docs/api/doxygen/html/index.html

      - name: Generate branch-aware Git browser data
        run: python scripts/build_git_browser_index.py --output docs/git-browser-data

      - name: Validate and build the site
        run: |
          python scripts/validate_mkdocs_nav.py
          test -s docs/git-browser-data/index.json
          mkdocs build --strict

      - name: Configure deployment commit identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve root source-browser highlighter
        run: cp docs/javascripts/git-browser-highlighter.js "$RUNNER_TEMP/git-browser-highlighter.js"

      - name: Publish versioned documentation without rewriting history
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mike deploy --push --update-aliases "$VERSION" latest

      - name: Publish project-root robots.txt and sitemap
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git fetch origin gh-pages:gh-pages
          git switch gh-pages
          test -s "$VERSION/sitemap.xml"
          test -s "$VERSION/git-browser-data/index.json"
          mkdir -p javascripts stylesheets
          cp "$RUNNER_TEMP/git-browser-highlighter.js" javascripts/git-browser-highlighter.js
          cp latest/javascripts/git-browser.js javascripts/git-browser.js
          cp latest/stylesheets/git-browser.css stylesheets/git-browser.css
          rm -rf git-browser-data
          cp -R latest/git-browser-data git-browser-data
          cat > 404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SneppX-ALG Repository Browser</title>
            <link rel="stylesheet" href="/sneppx-alg/stylesheets/git-browser.css">
            <script src="/sneppx-alg/latest/javascripts/git-browser-highlighter.js" defer></script>
            <script src="/sneppx-alg/javascripts/git-browser.js" defer></script>
          </head>
          <body>
            <main id="git-browser-root" data-git-browser></main>
          </body>
          </html>
          EOF
          cp "$VERSION/sitemap.xml" sitemap.xml
          grep -q "https://sneppx.github.io/sneppx-alg/$VERSION/" sitemap.xml
          printf '%s\n' 'User-agent: *' 'Allow: /' '' 'Sitemap: https://sneppx.github.io/sneppx-alg/sitemap.xml' > robots.txt
          grep -Fqx 'User-agent: *' robots.txt
          grep -Fqx 'Sitemap: https://sneppx.github.io/sneppx-alg/sitemap.xml' robots.txt
          test -s "$VERSION/llms.txt"
          cp "$VERSION/llms.txt" llms.txt
          cat > index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SneppX-ALG | Native C/C++ Machine-Learning Framework</title>
            <meta name="description" content="SneppX-ALG is an experimental native C/C++ machine-learning framework with Python tensor, autograd, and neural-network APIs.">
            <meta name="robots" content="index,follow">
            <link rel="canonical" href="https://sneppx.github.io/sneppx-alg/">
          </head>
          <body>
            <main>
              <h1>SneppX-ALG</h1>
              <p>SneppX-ALG is an experimental open-source machine-learning framework with a native C/C++ codebase and Python APIs for tensor operations, automatic differentiation, and neural-network components.</p>
              <p><strong>Project maturity: Alpha.</strong> API coverage and validation vary by component and backend. SneppX-ALG is not a drop-in replacement for PyTorch or TensorFlow.</p>
              <h2>Project status</h2>
              <p>The Python distributed backend supports single-process execution and local sampler utilities. Validated multi-rank process groups, collectives, FSDP/ZeRO training, and multi-node execution are not currently available.</p>
              <p>Security components are experimental and are not independently certified. Post-quantum implementations have documented interoperability gaps and are not FIPS validated.</p>
              <h2>Explore the project</h2>
              <ul>
                <li><a href="/sneppx-alg/$VERSION/">Documentation and guides</a></li>
                <li><a href="/sneppx-alg/$VERSION/getting-started/">Getting started</a></li>
                <li><a href="/sneppx-alg/$VERSION/api/python/">Python API reference</a></li>
                <li><a href="/sneppx-alg/$VERSION/security/">Security architecture and limitations</a></li>
                <li><a href="/sneppx-alg/$VERSION/roadmap/tensorflow-pytorch-parity/">Framework roadmap</a></li>
                <li><a href="/sneppx-alg/llms.txt">Project summary for AI assistants</a></li>
                <li><a href="https://github.com/SneppX/sneppx-alg">Source repository</a></li>
                <li><a href="https://pypi.org/project/sneppx-alg/">Python package on PyPI</a></li>
              </ul>
            </main>
          </body>
          </html>
          EOF
          git add robots.txt sitemap.xml 404.html javascripts/git-browser-highlighter.js javascripts/git-browser.js stylesheets/git-browser.css git-browser-data index.html llms.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish current sitemap and robots.txt"
            git push origin gh-pages
          fi
