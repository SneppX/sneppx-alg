name: Lint & Docs Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - name: Validate key files parse
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest pyyaml
          python -c "import json; json.load(open('CMakePresets.json')) if __import__('os').path.exists('CMakePresets.json') else None"
          python -c "import yaml; yaml.safe_load(open('mkdocs.yml', encoding='utf-8'))"
          python -c "import glob, yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in glob.glob('.github/workflows/*.yml')]"
          python -m compileall -q bindings/python/SneppX_ALG/interface_bindings/generation.py bindings/python/SneppX_ALG/interface_bindings/inference_server.py bindings/python/SneppX_ALG/interface_bindings/hf_integration.py bindings/python/SneppX_ALG/interface_bindings/model_zoo.py bindings/python/SneppX_ALG/interface_bindings/serve_cli.py
      - name: README integrity test
        env:
          PYTHONPATH: bindings/python
        run: python -m pytest tests/python/test_readme_integrity.py -q -p no:cacheprovider
      - name: CTM compile and smoke test
        run: |
          python -m compileall -q ctm_tools/py
          python ctm_tools/py/ctm.py . --format json > /tmp/ctm-report.json
          python -c "import json; r=json.load(open('/tmp/ctm-report.json', encoding='utf-8')); assert r['schema_version'] == 1 and r['files'] > 0"
          python ctm_tools/py/ctm_summary_report.py . --format json > /tmp/ctm-summary.json
          python -c "import json; r=json.load(open('/tmp/ctm-summary.json', encoding='utf-8')); assert r['tool'] == 'ctm_summary_report' and r['files'] > 0"
          python ctm_tools/py/ctm_find_large_files.py . --min-size 999999999 --format json > /tmp/ctm-large.json
          python -c "import json; r=json.load(open('/tmp/ctm-large.json', encoding='utf-8')); assert 'files' in r"
          cmake -S ctm_tools -B /tmp/ctm-build
          cmake --build /tmp/ctm-build --target ctm-help
