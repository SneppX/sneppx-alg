name: Code Formatting Check

on:
  push:
    branches: [main, "validation/**", "automation/format-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Verify repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.2.0

      - name: Verify all configured formatters and linters
        run: SKIP=sneppx-docs pre-commit run --all-files

      - name: Show formatter changes on failure
        if: failure()
        run: |
          git --no-pager diff --stat
          git --no-pager diff -- README.md mkdocs.yml overrides/main.html pyproject.toml bindings/python/pyproject.toml docs/index.md docs/security.md docs/FAQ.md docs/autograd-guide.md docs/guide/quickstart.md docs/distributed-guide.md docs/cookbook/distributed.md docs/tutorials/distributed_training.md bindings/python/SneppX_ALG/interface_bindings/distributed.py bindings/python/SneppX_ALG/interface_bindings/fsdp.py tests/python/test_distributed.py docs/security/audits/index.md docs/security/audits/2026-11-22-security-and-correctness-audit.md docs/llms.txt
      - name: Reject formatter changes in CI
        run: git diff --exit-code
