name: Security and Engineering Quality Gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secret-and-dependency-audit:
    name: Secret and Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history with open-source Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --disable-pip-version-check .
          python -m pip install --disable-pip-version-check --upgrade 'setuptools>=84.1.0' pip-audit
          pip-audit --local

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, rust]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'c-cpp' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  sanitizer-fuzz-regressions:
    name: ASan, UBSan and deterministic fuzz regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - name: Configure instrumented build
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON
          -DSNEPPX_BUILD_BENCHMARKS=OFF -DSNEPPX_BUILD_CUDA=OFF
          -DSNEPPX_USE_ASAN=ON -DSNEPPX_USE_UBSAN=ON
      - run: cmake --build build/sanitizers --parallel 2
      - name: Run focused fuzz and checkpoint regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers -R 'fuzz_tensor_native|checkpoint_integrity_native' --output-on-failure --timeout 180

  cuda-compile:
    name: CUDA compile validation (no GPU required)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Compile CUDA-enabled project configuration
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace nvidia/cuda:12.6.3-devel-ubuntu22.04 bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ninja-build build-essential && curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz | tar -xz -C /opt && export PATH=/opt/cmake-3.31.6-linux-x86_64/bin:$PATH && cmake --version && cmake -S . -B build/cuda-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES='80;90' -DSNEPPX_BUILD_TESTS=OFF -DSNEPPX_BUILD_BENCHMARKS=OFF -DSNEPPX_BUILD_CUDA=ON && cmake --build build/cuda-ci --parallel 2'

  benchmark-smoke:
    name: Performance benchmark smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - name: Build benchmark targets
        run: |
          cmake -S . -B build/bench-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_BENCHMARKS=ON -DSNEPPX_BUILD_CUDA=OFF
          cmake --build build/bench-ci --parallel 2
      - name: Run benchmark smoke tests
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r executable; do
            "$executable" > "$RUNNER_TEMP/$(basename "$executable").log"
            count=$((count + 1))
          done < <(find build/bench-ci -type f -executable -name 'bench_*' | sort)
          test "$count" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/bench_*.log
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Native coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential gcovr
      - name: Configure coverage build
        run: >-
          cmake -S . -B build/coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Coverage -DENABLE_COVERAGE=ON
          -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_BENCHMARKS=OFF
          -DSNEPPX_BUILD_CUDA=OFF
      - run: cmake --build build/coverage --parallel 2
      - name: Run coverage tests
        run: ctest --test-dir build/coverage -E '^object_pool_native$' --output-on-failure --timeout 180
      - run: gcovr --root . --filter '^(kernel|lib|security|net|fs)/' --xml-pretty --output coverage.xml --print-summary
      - uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

  public-api-compatibility:
    name: Public C and C++ API compile compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Compile representative public C headers
        run: |
          printf '%s\\n' '#include "neural_core/kernel/multidimensional_tensor_engine.h"' '#include "neural_core/security/sha256.h"' 'int main(void) { return 0; }' | cc -std=c11 -Wall -Wextra -Iinclude -x c -fsyntax-only -
      - name: Compile representative public C++ headers
        run: |
          printf '%s\\n' '#include "neural_core/model_zoo/model_factory.hpp"' 'int main() { return 0; }' | c++ -std=c++20 -Wall -Wextra -Iinclude -fsyntax-only -x c++ -

  sbom-and-license-inventory:
    name: SBOM and license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sneppx-alg-sbom-${{ github.sha }}.spdx.json
          upload-artifact: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - name: Generate Python license inventory
        run: |
          python -m pip install --disable-pip-version-check .
          python -m pip install --disable-pip-version-check pip-licenses
          pip-licenses --format=json --output-file=python-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-license-inventory-${{ github.sha }}
          path: python-licenses.json
          if-no-files-found: error
          retention-days: 30
