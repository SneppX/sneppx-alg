name: CI

on:
  push:
    branches: [main, "validation/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-safe-tests:
    name: Python safe tests (CPU-only, no LLM/GPU/downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest pyyaml fastapi cryptography
      - name: Run safe per-file tests
        env:
          PYTHONPATH: bindings/python
        run: |
          python -m pytest \
            tests/python/test_readme_integrity.py \
            tests/python/test_ctm_tools.py \
            tests/python/test_serve_cli.py \
            tests/python/test_auth_header.py \
            tests/python/test_hub_client_transport_source.py \
            tests/python/test_route_auth_contract.py \
            tests/python/test_autograd_regressions.py \
            tests/python/test_autograd_grad_api.py \
            tests/python/test_autograd_grad_mode.py \
            tests/python/test_hf_safetensors.py \
            tests/python/test_hf_integration.py \
            tests/python/test_model_zoo.py \
            tests/python/test_checkpoint.py \
            tests/python/test_crypto_sign.py \
            tests/python/test_data_loader.py \
            tests/python/test_distributed_sampler_contract.py \
            tests/python/test_tokenizer.py \
            tests/python/test_tensor.py \
            model_hub/tests/test_client_transport_security.py \
            tests/python/test_acvp_kat_harness.py \
            tests/python/test_nn.py \
            tests/python/test_optim.py \
            tests/python/test_state_dict.py \
            tests/python/test_init.py \
            tests/python/test_norm.py \
            tests/python/test_phase2_ops.py \
            tests/python/test_firewall.py \
            tests/python/test_firewall_network.py \
            tests/python/test_firewall_application.py \
            tests/python/test_firewall_transport.py \
            tests/python/test_firewall_network_hardening.py \
            tests/python/test_firewall_application_hardening.py \
            tests/python/test_firewall_asgi.py \
            tests/python/test_firewall_policy.py \
            tests/python/test_firewall_transport_hardening.py \
            tests/python/test_user_store.py \
            tests/python/test_api_key_manager.py \
            tests/python/test_api_gateway.py \
            tests/python/test_user_store_sessions.py \
            tests/python/test_session_authentication.py \
            tests/python/test_api_gateway_security.py \
            tests/python/test_security_runtime_hardening.py \
            -q -p no:cacheprovider

  native-build-smoke:
    name: Native build and targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential
      - name: Configure native build
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_HTTP=ON -DSNEPPX_BUILD_CUDA=OFF
      - name: Build native targets
        run: cmake --build build/ci --config Release -j 2
      - name: Run complete native test suite
        run: ctest --test-dir build/ci -C Release --output-on-failure --timeout 120
      - name: Set up Python for HTTP integration tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install HTTP integration test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run C HTTP server integration tests
        env:
          PYTHONPATH: bindings/python
        run: |
          HTTP_BIN="$(find build/ci -type f -name http_server_demo -perm -111 -print -quit)"
          test -n "$HTTP_BIN"
          SNEPPX_HTTP_BIN="$HTTP_BIN" python -m pytest tests/python/test_http_api.py -q -p no:cacheprovider
