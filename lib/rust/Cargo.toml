[package]
name = "neural-core-algo"
version = "1.1.1"
edition = "2021"
authors = ["Ammar [SNEPPX] <algoSNEPPX@gmail.com>"]
description = "Rust bindings for SNEPPX-ALG tensor library — tensor ops, model building, training loop"
license = "MIT"
repository = "https://github.com/SneppX/sneppx-alg"
homepage = "https://github.com/SneppX/sneppx-alg"
keywords = ["tensor", "neural-network", "machine-learning", "deep-learning"]
categories = ["science::robotics", "algorithms"]

# This crate is a member of the repository-root Cargo workspace. Declaring a
# nested [workspace] here makes `cargo fmt --all` fail with multiple roots.
[lib]
crate-type = ["lib"]
